# Arthala ID — automated dependency updates
# npm (apps/web) is added in Phase 4.1 once apps/web/package.json exists.
version: 2
updates:
  - package-ecosystem: "uv"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
      time: "06:00"
      timezone: "Asia/Jakarta"
    open-pull-requests-limit: 5
    commit-message:
      prefix: "build(deps)"
    groups:
      dev-tooling:
        dependency-type: "development"

  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
      time: "06:00"
      timezone: "Asia/Jakarta"
    commit-message:
      prefix: "ci(deps)"

  - package-ecosystem: "docker-compose"
    directory: "/infra/docker"
    schedule:
      interval: "weekly"
      day: "monday"
      time: "06:00"
      timezone: "Asia/Jakarta"
    commit-message:
      prefix: "build(deps)"
    ignore:
      # AGENTS.md §2.3 pins local sandbox to Postgres 16
      - dependency-name: "postgres"
        update-types: ["version-update:semver-major"]
