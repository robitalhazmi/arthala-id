# Arthala ID — baseline CI quality gates
# Required status checks on `main`: python-ci, dbt-ci, web-ci, compose-validate, gitleaks
name: ci

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  UV_VERSION: "0.13.0"
  PYTHON_VERSION: "3.12"
  NODE_VERSION: "22"
  # CI must never reach production endpoints (AGENTS.md §2.3)
  APP_ENV: ci

jobs:
  python-ci:
    name: python-ci
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7

      - name: Set up uv + Python ${{ env.PYTHON_VERSION }}
        uses: astral-sh/setup-uv@v10.4.0
        with:
          version: ${{ env.UV_VERSION }}
          python-version: ${{ env.PYTHON_VERSION }}
          enable-cache: true
          cache-dependency-glob: uv.lock

      - name: Install dependencies (frozen lockfile)
        run: uv sync --frozen

      - name: Ruff lint
        run: uv run ruff check --output-format=github .

      - name: Ruff format check
        run: uv run ruff format --check .

      - name: Mypy (strict)
        run: uv run mypy apps/api apps/worker pipelines

      - name: Pytest + coverage
        run: uv run pytest --cov --cov-report=term-missing --cov-report=xml

  dbt-ci:
    name: dbt-ci
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7

      - name: Detect dbt project
        id: detect
        run: |
          if [ -f pipelines/dbt/dbt_project.yml ]; then
            echo "present=true" >> "$GITHUB_OUTPUT"
          else
            echo "present=false" >> "$GITHUB_OUTPUT"
            echo "::notice::pipelines/dbt/dbt_project.yml not found yet (Phase 1.3) - skipping dbt checks."
          fi

      - name: Set up uv + Python ${{ env.PYTHON_VERSION }}
        if: steps.detect.outputs.present == 'true'
        uses: astral-sh/setup-uv@v10.4.0
        with:
          version: ${{ env.UV_VERSION }}
          python-version: ${{ env.PYTHON_VERSION }}
          enable-cache: true
          cache-dependency-glob: uv.lock

      - name: dbt parse + test (offline DuckDB fixtures)
        if: steps.detect.outputs.present == 'true'
        working-directory: pipelines/dbt
        run: |
          uv sync --frozen
          uv run dbt parse
          uv run dbt test --target local

  web-ci:
    name: web-ci
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7

      - name: Detect Next.js app
        id: detect
        run: |
          if [ -f apps/web/package.json ]; then
            echo "present=true" >> "$GITHUB_OUTPUT"
          else
            echo "present=false" >> "$GITHUB_OUTPUT"
            echo "::notice::apps/web/package.json not found yet (Phase 4.1) - skipping web checks."
          fi

      - name: Set up Node ${{ env.NODE_VERSION }}
        if: steps.detect.outputs.present == 'true'
        uses: actions/setup-node@v7
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: apps/web/package-lock.json

      - name: Lint, typecheck & build
        if: steps.detect.outputs.present == 'true'
        working-directory: apps/web
        run: |
          npm ci
          npm run lint
          npm run typecheck
          npm run build

  compose-validate:
    name: compose-validate
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7

      - name: Validate local sandbox compose
        run: docker compose -f infra/docker/docker-compose.local.yml config -q

      - name: Validate Coolify production compose + VPS guardrails
        run: |
          prod=infra/coolify/docker-compose.prod.yml
          if [ ! -f "$prod" ]; then
            echo "::notice::$prod not found yet (Phase 5.1) - skipping."
            exit 0
          fi
          docker compose -f "$prod" config -q
          # AGENTS.md §2.1: no heavy JVM / broker / TSDB services on the 2 GB VPS.
          if docker compose -f "$prod" config --images | grep -Eiq 'spark|hadoop|airflow|kafka|zookeeper|redpanda|flink|prometheus|grafana/grafana'; then
            echo "::error::Forbidden heavy service image found in $prod (see AGENTS.md §2.1)."
            exit 1
          fi

  gitleaks:
    name: gitleaks
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Scan for secrets
        uses: gitleaks/gitleaks-action@v3
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
